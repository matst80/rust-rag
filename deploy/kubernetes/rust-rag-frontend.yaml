apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-rag-frontend-config
  labels:
    app.kubernetes.io/name: rust-rag-frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  RAG_AUTH_ENABLED: "true"
  APP_BASE_URL: "https://rag.k6n.net"
  RAG_API_URL: "http://rag-service-cuda:4001"
  ZITADEL_ISSUER: "https://users.k6n.net"
  ZITADEL_CLIENT_ID: "rust-rag"
  ZITADEL_SCOPES: "openid profile email offline_access"
  # ACP WebSockets are now proxied by the backend at wss://<host>/api/acp/ws,
  # so the frontend no longer needs ACP_WS_PUBLIC_URL or ACP_WS_TOKEN.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-rag-frontend
  labels:
    app.kubernetes.io/name: rust-rag-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-rag-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-rag-frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: frontend
          image: matst80/rust-rag-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: rust-rag-frontend-config
            - secretRef:
                name: rust-rag-frontend-auth
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-rag-frontend
  labels:
    app.kubernetes.io/name: rust-rag-frontend
spec:
  selector:
    app.kubernetes.io/name: rust-rag-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
